# Queries configuration for BankAccount transactions with JWT authentication
# Account holders can only query their own transaction data

queries:
  # Get transactions for the authenticated user's accounts
  my_transactions:
    sql: "SELECT * FROM transactions WHERE owner_id = :user_id ORDER BY transaction_timestamp DESC LIMIT :limit"
    params:
      - name: user_id
        type: string
      - name: limit
        type: int

  # Get balance for the authenticated user's accounts
  my_account_balance:
    sql: "SELECT account_id, owner_name, SUM(CASE WHEN transaction_type IN ('account_created', 'deposit') THEN amount ELSE -amount END) as balance FROM transactions WHERE owner_id = :user_id GROUP BY account_id, owner_name ORDER BY balance DESC"
    params:
      - name: user_id
        type: string

  # Get recent transactions for the authenticated user
  my_recent_transactions:
    sql: "SELECT * FROM transactions WHERE owner_id = :user_id ORDER BY transaction_timestamp DESC LIMIT :limit"
    params:
      - name: user_id
        type: string
      - name: limit
        type: int

  # Get transactions for a specific account (only if owned by authenticated user)
  my_account_transactions:
    sql: "SELECT * FROM transactions WHERE account_id = :account_id AND owner_id = :user_id ORDER BY transaction_timestamp DESC"
    params:
      - name: account_id
        type: string
      - name: user_id
        type: string

  # Get transaction summary by type for the authenticated user
  my_transaction_summary:
    sql: "SELECT transaction_type, COUNT(*) as count, SUM(amount) as total_amount FROM transactions WHERE owner_id = :user_id GROUP BY transaction_type ORDER BY count DESC"
    params:
      - name: user_id
        type: string

  # Count transactions for the authenticated user
  my_transaction_count:
    sql: "SELECT COUNT(*) as total_transactions FROM transactions WHERE owner_id = :user_id"
    params:
      - name: user_id
        type: string