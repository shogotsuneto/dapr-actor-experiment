# Alternative Docker Compose using Dapr Bearer Middleware
# This shows how to replace the custom JWT Gateway with Dapr's built-in Bearer middleware

version: '3.8'

services:
  # JWKS Mock Server for JWT generation and validation
  jwks-server:
    image: shogotsuneto/jwks-mock-api:v0.0.3
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Actor Service (Counter and BankAccount actors)
  actor-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JWKS_URL=http://jwks-server:3000/.well-known/jwks.json
      - JWT_ISSUER=http://localhost:3000
      - JWT_AUDIENCE=dev-api
    depends_on:
      jwks-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dapr Sidecar with Bearer Middleware (replaces JWT Gateway)
  actor-service-dapr:
    image: "daprio/daprd:latest"
    command: [
      "./daprd",
      "-app-id", "actor-service",
      "-app-port", "8080",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-config", "/configs/dapr-config-bearer.yaml",
      "-components-path", "/components",
      "-log-level", "info"
    ]
    volumes:
      - "./components:/components"
      - "./configs:/configs"
    ports:
      - "3500:3500"  # HTTP API (with Bearer middleware)
      - "50001:50001"  # gRPC API
    depends_on:
      actor-service:
        condition: service_healthy
      jwks-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3500/v1.0/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: dapr-actor-network