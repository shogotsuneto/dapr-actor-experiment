apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: dapr-actor-experiment
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: "redis:6379"
  - name: redisPassword
    value: ""
  - name: actorStateStore
    value: "true"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: bearer-middleware
  namespace: dapr-actor-experiment
spec:
  type: middleware.http.bearer
  version: v1
  metadata:
  - name: jwksURL
    value: "http://jwks-mock-api:3000/.well-known/jwks.json"
  - name: issuer
    value: "http://jwks-mock-api:3000"
  - name: audience
    value: "dapr-actor-service"
---
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config-bearer
  namespace: dapr-actor-experiment
spec:
  httpPipeline:
    handlers:
    - name: bearer-middleware
      type: middleware.http.bearer
  accessControl:
    defaultAction: allow
    trustDomain: "cluster.local"
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"