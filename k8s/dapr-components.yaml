apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-components
  namespace: dapr-actor-experiment
data:
  statestore.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: statestore
    spec:
      type: state.redis
      version: v1
      metadata:
      - name: redisHost
        value: "redis:6379"
      - name: redisPassword
        value: ""
      - name: actorStateStore
        value: "true"
  middleware-bearer.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: bearer-middleware
    spec:
      type: middleware.http.bearer
      version: v1
      metadata:
      - name: jwksURL
        value: "http://jwks-mock-api:3000/.well-known/jwks.json"
      - name: issuer
        value: "http://jwks-mock-api:3000"
      - name: audience
        value: "dapr-actor-service"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-config
  namespace: dapr-actor-experiment
data:
  config.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: dapr-config-bearer
    spec:
      httpPipeline:
        handlers:
        - name: bearer-middleware
          type: middleware.http.bearer
      accessControl:
        defaultAction: allow
        trustDomain: "public"