---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-dashboard
  namespace: dapr-actor-experiment
  labels:
    app: dapr-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-dashboard
  template:
    metadata:
      labels:
        app: dapr-dashboard
    spec:
      containers:
      - name: dapr-dashboard
        image: daprio/dashboard:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NAMESPACE
          value: "dapr-actor-experiment"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-dashboard
  namespace: dapr-actor-experiment
  labels:
    app: dapr-dashboard
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
    protocol: TCP
    name: http
  selector:
    app: dapr-dashboard