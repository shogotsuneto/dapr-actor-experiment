# Docker Compose configuration for Dapr Actor Demo
#
# This file provides two modes of operation:
# 1. Default mode: Runs only the actor service with Redis and Dapr sidecar
#    Usage: docker compose up -d
# 2. Client mode: Additionally runs the client application with its own Dapr sidecar
#    Usage: docker compose --profile client up -d
#
# The actor service builds from source code, so no pre-compilation is needed.
# All services use health checks to ensure proper startup ordering.

services:
  # JWKS Server for JWT validation
  jwks-server:
    image: ghcr.io/shogotsuneto/jwks-mock-api:latest
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # JWKS Mock API for JWT token validation (legacy)
  jwks-mock-api:
    image: ghcr.io/shogotsuneto/jwks-mock-api:v0.0.4
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_ISSUER=http://jwks-mock-api:3000
      - JWT_AUDIENCE=dapr-actor-service
      - KEY_COUNT=2
      - KEY_IDS=key-1,key-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for state store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dapr placement service for actors
  placement:
    image: daprio/dapr:1.14.4
    command: ["./placement", "-port", "50006", "-log-level", "debug"]
    ports:
      - "50006:50006"

  # Actor service (builds from source)
  actor-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DAPR_GRPC_PORT=50001
      - DAPR_GRPC_ENDPOINT=actor-service-dapr:50001
      - JWKS_INTROSPECT_URL=http://jwks-mock-api:3000/introspect
      - JWT_ISSUER=http://jwks-mock-api:3000
    depends_on:
      jwks-mock-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      placement:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dapr sidecar for actor service  
  actor-service-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "-app-id", "actor-service",
      "-app-port", "8080",
      "-app-channel-address", "actor-service",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-placement-host-address", "placement:50006",
      "-resources-path", "/components",
      "-config", "/config/dapr-config-bearer.yaml",
      "-log-level", "debug"
    ]
    volumes:
      - "./components:/components"
      - "./configs:/config"
    ports:
      - "3500:3500"
      - "50001:50001"
    depends_on:
      actor-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      placement:
        condition: service_started
      jwks-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3500/v1.0/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Client application
  client:
    image: golang:1.24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DAPR_HTTP_ENDPOINT=http://client-dapr:3501
      - JWKS_GENERATE_URL=http://jwks-mock-api:3000/generate-token
      - JWT_ISSUER=http://jwks-mock-api:3000
    depends_on:
      jwks-mock-api:
        condition: service_healthy
      actor-service-dapr:
        condition: service_started
    command: |
      sh -c "
        apk add --no-cache ca-certificates git curl &&
        go mod download &&
        go run ./cmd/client
      "
    profiles:
      - client

  # Dapr sidecar for client
  client-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "-app-id", "client",
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50002",
      "-log-level", "info"
    ]
    depends_on:
      - actor-service-dapr
    profiles:
      - client

networks:
  default:
    driver: bridge