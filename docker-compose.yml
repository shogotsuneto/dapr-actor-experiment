# Docker Compose configuration for Dapr Actor Demo
#
# This file provides two modes of operation:
# 1. Default mode: Runs only the actor service with Redis and Dapr sidecar
#    Usage: docker compose up -d
# 2. Client mode: Additionally runs the client application with its own Dapr sidecar
#    Usage: docker compose --profile client up -d
#
# The actor service builds from source code, so no pre-compilation is needed.
# All services use health checks to ensure proper startup ordering.

services:
  # JWKS Mock API for JWT token validation
  jwks-mock-api:
    image: ghcr.io/shogotsuneto/jwks-mock-api:v0.0.4
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_ISSUER=http://jwks-mock-api:3000
      - JWT_AUDIENCE=dapr-actor-service
      - KEY_COUNT=2
      - KEY_IDS=key-1,key-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for external event store
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=eventstore
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for state store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dapr placement service for actors
  placement:
    image: daprio/dapr:1.14.4
    command: ["./placement", "-port", "50006", "-log-level", "debug"]
    ports:
      - "50006:50006"

  # Actor service (builds from source)
  actor-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DAPR_GRPC_PORT=50001
      - DAPR_GRPC_ENDPOINT=actor-service-dapr:50001
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      placement:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dapr sidecar for actor service  
  actor-service-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "-app-id", "actor-service",
      "-app-port", "8080",
      "-app-channel-address", "actor-service",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-placement-host-address", "placement:50006",
      "-resources-path", "/components",
      "-config", "/config/dapr-config-bearer.yaml",
      "-log-level", "debug"
    ]
    volumes:
      - "./components:/components"
      - "./configs:/config"
    ports:
      - "3500:3500"
      - "50001:50001"
    depends_on:
      actor-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      placement:
        condition: service_started
      jwks-mock-api:
        condition: service_healthy

  # BankAccount Events Projector
  projector:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/projector"]
    environment:
      - POSTGRES_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/eventstore?sslmode=disable
      - EVENTS_TABLE_NAME=bankaccount_events
      - PROJECTION_INTERVAL_SECONDS=10
    depends_on:
      postgres:
        condition: service_healthy
      actor-service:
        condition: service_started
    restart: unless-stopped

  # Transactions Query Server
  query-server:
    image: ghcr.io/shogotsuneto/simple-query-server:v0.0.2
    ports:
      - "8081:8080"
    volumes:
      - "./configs/query-server:/configs"
    command: ["--db-config", "/configs/database.yaml", "--queries-config", "/configs/queries.yaml", "--server-config", "/configs/server.yaml", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
      projector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Client application
  client:
    image: golang:1.24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DAPR_HTTP_ENDPOINT=http://client-dapr:3501
      - JWKS_GENERATE_URL=http://jwks-mock-api:3000/generate-token
      - JWT_ISSUER=http://jwks-mock-api:3000
    depends_on:
      jwks-mock-api:
        condition: service_healthy
      actor-service-dapr:
        condition: service_started
    command: |
      sh -c "
        apk add --no-cache ca-certificates git curl &&
        go mod download &&
        go run ./cmd/client
      "
    profiles:
      - client

  # Dapr sidecar for client
  client-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "-app-id", "client",
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50002",
      "-log-level", "info"
    ]
    depends_on:
      - actor-service-dapr
    profiles:
      - client

networks:
  default:
    driver: bridge

volumes:
  postgres_data: