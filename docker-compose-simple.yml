version: '3.8'
services:
  # Redis for state management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dapr placement service
  placement:
    image: daprio/dapr:1.14.4
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

  # Actor service
  actor-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      placement:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - JWKS_INTROSPECT_URL=http://localhost:3000/introspect

  # Dapr sidecar for actor service
  actor-service-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "-app-id", "actor-service",
      "-app-port", "8080",
      "-app-channel-address", "actor-service",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-placement-host-address", "placement:50006",
      "-resources-path", "/components",
      "-config", "/config/config.yaml"
    ]
    volumes:
      - "./configs/dapr:/components"
      - "./configs/dapr:/config"
    depends_on:
      - actor-service
      - placement
    ports:
      - "3500:3500"
      - "50001:50001"